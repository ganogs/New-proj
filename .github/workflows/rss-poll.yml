name: Makkal Short News RSS Auto Publisher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll RSS and publish eligible stories
        env:
          SITE_URL: https://makkal-short-news.onrender.com
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "Missing repository secret ADMIN_PASSWORD"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 180 \
            -X POST "$SITE_URL/api/admin/poll" \
            -H "x-admin-password: $ADMIN_PASSWORD" \
            -H "content-type: application/json" \
            -d '{}'
